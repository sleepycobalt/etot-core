[project]
name = "etot-core"
version = "0.3.0"
description = "Shared engine for ETOT agentic loops: a plan -> act -> check -> revise controller, a structured LLM client, a run logger, and config loading. Motif is the first tool built on it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["agentic-loop", "llm", "claude", "etot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["anthropic>=0.40", "python-dotenv", "pyyaml"]

[project.urls]
Homepage = "https://etot.design"
Repository = "https://github.com/sleepycobalt/etot-core"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["etot_core"]
